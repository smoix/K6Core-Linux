image disk.img {
    hdimage {
        partition-table-type = "mbr"
    }

    # First sector (MBR) - write boot.img but preserve the partition table
    partition boot {
        in-partition-table = "no"
        image = "boot.img"
        offset = 0
        size = 512
        holes = {"(440; 512)"}
    }

    # Write GRUB2 core image into the MBR gap (starting at sector 1, i.e. offset 512 bytes)
    partition grub {
        in-partition-table = "no"
        image = "grub.img"
        offset = 512
    }

    # Single active primary EXT4 partition, aligned at 1MB (Sector 2048)
    # Sized so offset (1,048,576 bytes) + size (3,698,951,168 bytes) = 3,699,999,744 bytes (~3.7GB decimal)
    # Kept safely under a "4GB" CF card's nominal 4,000,000,000-byte capacity
    # Size must be a multiple of the 512-byte sector size, hence not exactly 3,698,951,424
    partition root {
        partition-type = 0x83
        image = "rootfs.ext2"
        bootable = "true"
        offset = 1M
        size = 3698951168
    }
}
